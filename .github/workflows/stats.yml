name: Stats

# Regenerates the ecosystem stats and publishes them to GitHub Pages, served at
# https://stats.odio.love/repos.json. The docs site fetches this at runtime, so
# a refresh needs no site rebuild — this workflow is the only thing that touches
# the GitHub API, and the site build stays token-free.

on:
  schedule:
    - cron: '0 6 * * *'  # daily refresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: Publish repos.json
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - run: npm ci

      # GH_STATS_TOKEN must be a *classic* PAT with public_repo scope: listing a
      # repo's stargazers (the cumulative-stars line) is refused for fine-grained
      # PATs, and GITHUB_TOKEN only sees this repo. Everything else in the script
      # works with any of them.
      - name: Generate stats
        run: npm run stats
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate download counts
        run: npm run downloads
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp src/data/stats.json _site/repos.json
          cp src/data/downloads.json _site/downloads.json
          echo 'stats.odio.love' > _site/CNAME

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # deploy-pages looks the artifact up once, right after the upload, and the
      # listing can lag by up to ~1 min (actions/deploy-pages#451). Re-running
      # the job is no fix (it can then find two artifacts), so retry in-job.
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait for the artifact listing
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
