name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # stats.json is gitignored and imported at build time, so regenerate it
      # first. Use the dedicated PAT; fall back to the auto GITHUB_TOKEN on fork
      # PRs (where secrets are unavailable) — read-only is enough for public repos.
      - name: Generate stats
        run: npm run stats
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  links:
    name: Check links
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --root-dir ./dist --exclude 'https://docs.odio.love/*' --exclude 'https://pipewire.org/*' --exclude 'https://gnudb.org/*' --exclude 'https://traefik.io/*' --exclude 'https://www.bluez.org/*' --exclude-path ./dist/404.html --accept 200,403,418 --insecure ./dist
          fail: true

  spelling:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npx cspell "src/content/docs/**/*.{md,mdx}"
