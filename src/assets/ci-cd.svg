<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="770" viewBox="0 0 1100 770" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="odio CI/CD pipeline: in-house source repos go through CI on pull request and build on tag; third-party packaging repos build on an upstream release or a manual tag; odio-ci provides the shared release plumbing; component releases dispatch the odio-apt-repo rebuild, while the odios release carries the installer and Pi images; odio.love, the entry point, redirects to the latest odios release, which runs on the odio node and pulls packages from apt.odio.love.">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5ab81e"/>
    </marker>
    <style>
      .label { fill: #e8e4dc; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #c8c4bc; font-size: 11.5px; text-anchor: middle; }
      .cmd { fill: #e8e4dc; font-size: 13px; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .flow { fill: #8fd46a; font-size: 11.5px; font-style: italic; text-anchor: middle; }
      .flow-start { text-anchor: start; }
      .flow-end { text-anchor: end; }
      .line { stroke: #5ab81e; stroke-width: 1.5; fill: none; }
      .line-dashed { stroke: #5ab81e; stroke-width: 1.5; fill: none; stroke-dasharray: 5,4; }
      .box { fill: #142010; stroke: #3a7020; stroke-width: 1.5; }
      .box-accent { fill: #1e3a18; stroke: #5ab81e; stroke-width: 1.8; }
    </style>
  </defs>

  <!-- Row 1: in-house source repos (left) and third-party packaging (right) -->
  <rect x="30" y="20" width="560" height="115" rx="8" class="box-accent"/>
  <text x="310" y="45" class="label">Source repos</text>
  <text x="310" y="68" class="sub">odios · go-odio-api · odioctl · go-mpd-discplayer</text>
  <text x="310" y="85" class="sub">mpd2mpris · snapclientmpris · odio-framebuffer-ui</text>
  <text x="310" y="102" class="sub">go-disc-cuer · go-odio-notify · pyodio</text>
  <text x="310" y="119" class="sub">odio-pwa · odio-ha · odio.love · odio-docs</text>

  <rect x="690" y="20" width="380" height="90" rx="8" class="box-accent"/>
  <text x="880" y="45" class="label">Third-party packaging</text>
  <text x="880" y="68" class="sub">spotifyd · odio-mympd · odio-qbz</text>
  <text x="880" y="85" class="sub">odio-upmpdcli · gstreamer1.0-openaptx</text>

  <!-- Source repos → CI checks (pull request) and Build (tag) -->
  <path d="M 180 135 L 180 205" class="line" marker-end="url(#arrow)"/>
  <text x="190" y="174" class="flow flow-start">pull request</text>

  <path d="M 450 135 L 450 165 L 630 165 L 630 205" class="line" marker-end="url(#arrow)"/>
  <text x="540" y="157" class="flow">git tag</text>

  <!-- Third-party packaging → Build (upstream release or manual tag) -->
  <path d="M 880 110 L 880 230 L 785 230" class="line" marker-end="url(#arrow)"/>
  <text x="890" y="165" class="flow flow-start">upstream release</text>
  <text x="890" y="180" class="flow flow-start">or manual tag v*</text>

  <!-- Row 2: CI checks (left), Build & package (middle), odio-ci (right) -->
  <rect x="40" y="210" width="280" height="120" rx="8" class="box"/>
  <text x="180" y="238" class="label">CI checks</text>
  <text x="180" y="262" class="sub">go test · golangci-lint · gofmt</text>
  <text x="180" y="279" class="sub">pytest · mypy · ruff</text>
  <text x="180" y="296" class="sub">vitest · ansible-lint · shellcheck</text>
  <text x="180" y="313" class="sub">lychee · cspell · site builds</text>

  <rect x="480" y="210" width="300" height="110" rx="8" class="box"/>
  <text x="630" y="238" class="label">Build &amp; package</text>
  <text x="630" y="262" class="sub">amd64 · arm64 · armhf · armv7hf · all</text>
  <text x="630" y="279" class="sub">.deb · archives · sdist + wheel · .img.xz</text>
  <text x="630" y="296" class="sub">Docker images · Pi Imager manifest</text>

  <rect x="820" y="252" width="250" height="72" rx="8" class="box"/>
  <text x="945" y="277" class="label">odio-ci</text>
  <text x="945" y="298" class="sub">release.yml · watch-upstream</text>
  <text x="945" y="314" class="sub">resolve-version · check-binary</text>

  <!-- odio-ci → Build (shared plumbing) -->
  <path d="M 820 285 L 785 285" class="line" marker-end="url(#arrow)"/>

  <!-- Build → component releases (v* tag) and odios release (CalVer tag) -->
  <path d="M 600 320 L 600 350 L 500 350 L 500 380" class="line" marker-end="url(#arrow)"/>
  <text x="550" y="343" class="flow">v* tag</text>

  <path d="M 660 320 L 660 350 L 840 350 L 840 380" class="line" marker-end="url(#arrow)"/>
  <text x="750" y="343" class="flow">CalVer tag (odios)</text>

  <!-- Row 3: component releases (middle) and odios release (right) -->
  <rect x="360" y="385" width="280" height="58" rx="8" class="box-accent"/>
  <text x="500" y="410" class="label">Component releases</text>
  <text x="500" y="428" class="sub">.deb · sdist + wheel · archives</text>

  <rect x="700" y="385" width="280" height="75" rx="8" class="box-accent"/>
  <text x="840" y="410" class="label">odios release</text>
  <text x="840" y="428" class="sub">install.sh · tarball</text>
  <text x="840" y="445" class="sub">.img.xz · Pi Imager manifests</text>

  <!-- Component releases → odio-apt-repo (dispatch) -->
  <path d="M 360 414 L 180 414 L 180 505" class="line" marker-end="url(#arrow)"/>
  <text x="270" y="405" class="flow">repository_dispatch</text>

  <!-- odios release → odio node -->
  <path d="M 840 460 L 840 515" class="line" marker-end="url(#arrow)"/>
  <text x="850" y="483" class="flow flow-start">curl | bash</text>
  <text x="850" y="498" class="flow flow-start">or Pi Imager</text>

  <!-- Row 4: odio-apt-repo (left) and odio node (right) -->
  <rect x="40" y="510" width="280" height="100" rx="8" class="box-accent"/>
  <text x="180" y="535" class="label">odio-apt-repo</text>
  <text x="180" y="557" class="sub">reprepro: stable + testing suites</text>
  <text x="180" y="574" class="sub">GPG-signed · GitHub Pages</text>
  <text x="180" y="591" class="sub">apt.odio.love · cron Mon + Thu 04:00</text>

  <rect x="700" y="520" width="280" height="95" rx="8" class="box"/>
  <text x="840" y="545" class="label">odio node</text>
  <text x="840" y="567" class="sub">runs the Ansible playbook</text>
  <text x="840" y="584" class="sub">adds apt.odio.love as a source</text>
  <text x="840" y="601" class="sub">apt install odio-api, ...</text>

  <!-- odio-apt-repo → odio node (packages) -->
  <path d="M 320 565 L 695 565" class="line-dashed" marker-end="url(#arrow)"/>
  <text x="508" y="556" class="flow">apt install odio-*</text>

  <!-- Row 5: odio.love, the entry point -->
  <rect x="40" y="670" width="1030" height="85" rx="8" class="box-accent"/>
  <text x="555" y="695" class="label">odio.love · entry point</text>
  <text x="555" y="719" class="cmd">curl -fsSL https://odio.love/install | bash</text>
  <text x="555" y="741" class="sub">307 redirects, stable across releases: /install · /manifest.json · /odio.rpi-imager-manifest</text>

  <!-- odio.love → odios release (307 redirect), up the right side -->
  <path d="M 1025 670 L 1025 422 L 985 422" class="line" marker-end="url(#arrow)"/>
  <text x="1015" y="645" class="flow flow-end">307 redirect</text>
</svg>
