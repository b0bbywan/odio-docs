<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="odio repo graph: clients at top (odio-ha, odio-pwa), server daemons, shared Go modules (go-disc-cuer, go-odio-notify), odio-apt-repo distribution hub, then odios alongside odio.love and odio-docs, plus a hosting row with GitHub Pages and Vercel; deploy arrows go down to each platform, and the apt install fetch goes back up from GitHub Pages to odios.">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5ab81e"/>
    </marker>
    <marker id="arrow-runtime" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a9190"/>
    </marker>
    <style>
      .repo { fill: #142010; stroke: #3a7020; stroke-width: 1.3; }
      .repo-accent { fill: #1e3a18; stroke: #5ab81e; stroke-width: 1.6; }
      .repo-lib { fill: #0d130d; stroke: #486040; stroke-width: 1.3; }
      .repo-planned { fill: #0d130d; stroke: #486040; stroke-width: 1.3; stroke-dasharray: 4,3; }
      .repo-host { fill: #0d130d; stroke: #72797a; stroke-width: 1.2; stroke-dasharray: 4,3; }
      .name { fill: #e8e4dc; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
      .tag { fill: #c8c4bc; font-size: 10.5px; text-anchor: middle; font-style: italic; }
      .host-tag { fill: #a4adac; font-size: 10.5px; text-anchor: middle; }
      .edge-label { fill: #8fd46a; font-size: 10.5px; font-style: italic; text-anchor: middle; }
      .edge-label-runtime { fill: #a4adac; font-size: 10.5px; font-style: italic; text-anchor: middle; }
      .edge { stroke: #5ab81e; stroke-width: 1.4; fill: none; }
      .edge-planned { stroke: #5ab81e; stroke-width: 1.4; fill: none; stroke-dasharray: 4,3; }
      .edge-runtime { stroke: #8a9190; stroke-width: 1.3; fill: none; stroke-dasharray: 4,3; }
      .divider { stroke: #3a7020; stroke-width: 1; fill: none; stroke-dasharray: 2,4; opacity: 0.5; }
    </style>
  </defs>

  <!-- ROW 1: Clients (top) -->
  <rect x="260" y="30" width="160" height="50" rx="6" class="repo"/>
  <text x="340" y="52" class="name">odio-ha</text>
  <text x="340" y="68" class="tag">HA custom component</text>

  <rect x="460" y="30" width="160" height="50" rx="6" class="repo"/>
  <text x="540" y="52" class="name">odio-pwa</text>
  <text x="540" y="68" class="tag">Svelte client app</text>

  <!-- Runtime HTTP arrows from clients down to go-odio-api -->
  <path d="M 340 80 L 340 130" class="edge-runtime" marker-end="url(#arrow-runtime)"/>
  <path d="M 540 80 L 540 110 L 380 110 L 380 130" class="edge-runtime" marker-end="url(#arrow-runtime)"/>
  <text x="435" y="103" class="edge-label-runtime">HTTP at runtime</text>

  <!-- ROW 2: Server daemons -->
  <rect x="60" y="130" width="170" height="50" rx="6" class="repo-accent"/>
  <text x="145" y="152" class="name">go-mpd-discplayer</text>
  <text x="145" y="168" class="tag">CD / USB daemon (Go)</text>

  <rect x="250" y="130" width="140" height="50" rx="6" class="repo-accent"/>
  <text x="320" y="152" class="name">go-odio-api</text>
  <text x="320" y="168" class="tag">core REST API (Go)</text>

  <rect x="410" y="130" width="170" height="50" rx="6" class="repo"/>
  <text x="495" y="152" class="name">b0bbywan/spotifyd</text>
  <text x="495" y="168" class="tag">Spotify daemon (fork)</text>

  <rect x="600" y="130" width="140" height="50" rx="6" class="repo"/>
  <text x="670" y="152" class="name">mpd2mpris</text>
  <text x="670" y="168" class="tag">MPRIS for MPD (fork)</text>

  <rect x="760" y="130" width="150" height="50" rx="6" class="repo"/>
  <text x="835" y="152" class="name">snapclientmpris</text>
  <text x="835" y="168" class="tag">MPRIS for Snapcast</text>

  <rect x="930" y="130" width="150" height="50" rx="6" class="repo"/>
  <text x="1005" y="152" class="name">odio-mympd</text>
  <text x="1005" y="168" class="tag">myMPD .deb (build-only)</text>

  <!-- ROW 3: Shared Go modules -->
  <rect x="60" y="220" width="140" height="44" rx="6" class="repo-lib"/>
  <text x="130" y="240" class="name">go-disc-cuer</text>
  <text x="130" y="256" class="tag">Go modules</text>

  <rect x="290" y="220" width="160" height="44" rx="6" class="repo-planned"/>
  <text x="370" y="240" class="name">go-odio-notify</text>
  <text x="370" y="256" class="tag">audio notify lib (planned)</text>

  <!-- Library edges -->
  <path d="M 130 220 L 130 180" class="edge" marker-end="url(#arrow)"/>
  <text x="105" y="204" class="edge-label" text-anchor="end">Go mod</text>

  <path d="M 370 220 L 370 180" class="edge-planned" marker-end="url(#arrow)"/>
  <text x="345" y="204" class="edge-label" text-anchor="end">Go mod</text>

  <!-- go-odio-notify → go-mpd-discplayer (over the top of go-disc-cuer) -->
  <path d="M 290 220 L 290 200 L 180 200 L 180 180" class="edge-planned" marker-end="url(#arrow)"/>
  <text x="235" y="195" class="edge-label">Go mod</text>

  <!-- .deb arrows from daemons down to apt-repo -->
  <path d="M 145 180 L 145 370" class="edge" marker-end="url(#arrow)"/>
  <text x="155" y="300" class="edge-label" text-anchor="start">.deb</text>

  <path d="M 320 180 L 320 370" class="edge" marker-end="url(#arrow)"/>
  <text x="330" y="300" class="edge-label" text-anchor="start">.deb</text>

  <path d="M 495 180 L 495 370" class="edge" marker-end="url(#arrow)"/>
  <text x="505" y="300" class="edge-label" text-anchor="start">.deb</text>

  <path d="M 670 180 L 670 370" class="edge" marker-end="url(#arrow)"/>
  <text x="680" y="300" class="edge-label" text-anchor="start">.deb</text>

  <path d="M 835 180 L 835 370" class="edge" marker-end="url(#arrow)"/>
  <text x="845" y="300" class="edge-label" text-anchor="start">.deb</text>

  <path d="M 1005 180 L 1005 370" class="edge" marker-end="url(#arrow)"/>
  <text x="1015" y="300" class="edge-label" text-anchor="start">.deb (cron-tracked)</text>

  <!-- ROW 4: odio-apt-repo hub -->
  <rect x="100" y="370" width="950" height="60" rx="8" class="repo-accent"/>
  <text x="575" y="393" class="name">odio-apt-repo</text>
  <text x="575" y="412" class="tag">reprepro · GPG-signed · weekly cron · apt.odio.love</text>

  <!-- ROW 5: odios + odio.love + odio-docs -->
  <rect x="280" y="470" width="300" height="70" rx="8" class="repo-accent"/>
  <text x="430" y="495" class="name">odios</text>
  <text x="430" y="513" class="tag">Ansible installer / orchestrator</text>
  <text x="430" y="528" class="tag">runs on your node</text>

  <rect x="600" y="470" width="220" height="70" rx="8" class="repo"/>
  <text x="710" y="495" class="name">odio.love</text>
  <text x="710" y="513" class="tag">307 → latest odios release</text>
  <text x="710" y="528" class="tag">/install · /manifest.json</text>

  <rect x="840" y="470" width="140" height="70" rx="8" class="repo"/>
  <text x="910" y="495" class="name">odio-docs</text>
  <text x="910" y="513" class="tag">Astro / Starlight</text>
  <text x="910" y="528" class="tag">docs.odio.love</text>

  <!-- odio.love → odios: 307 redirect to GH Release -->
  <path d="M 600 505 L 580 505" class="edge" marker-end="url(#arrow)"/>
  <text x="590" y="497" class="edge-label">307 → GH Release</text>

  <!-- apt-repo → GH Pages (deploy) and GH Pages → odios (apt install fetches .deb from here) -->
  <path d="M 180 430 L 180 580" class="edge" marker-end="url(#arrow)"/>
  <path d="M 315 580 L 315 540" class="edge" marker-end="url(#arrow)"/>
  <text x="325" y="560" class="edge-label" text-anchor="start">apt install odio-*</text>

  <!-- Vercel deploy arrows -->
  <path d="M 710 540 L 710 580" class="edge" marker-end="url(#arrow)"/>
  <path d="M 910 540 L 910 580" class="edge" marker-end="url(#arrow)"/>
  <path d="M 620 55 L 1085 55 L 1085 605 L 940 605" class="edge" marker-end="url(#arrow)"/>

  <!-- Divider between flow and hosting -->
  <line x1="40" y1="565" x2="1060" y2="565" class="divider"/>

  <!-- ROW 6: Hosting -->
  <rect x="50" y="580" width="300" height="60" rx="8" class="repo-host"/>
  <text x="200" y="602" class="name">GitHub Pages</text>
  <text x="200" y="622" class="host-tag">hosts apt.odio.love (odio-apt-repo)</text>

  <rect x="400" y="580" width="550" height="60" rx="8" class="repo-host"/>
  <text x="675" y="602" class="name">Vercel</text>
  <text x="675" y="622" class="host-tag">hosts odio.love · docs.odio.love (odio-docs) · pwa.odio.love (odio-pwa)</text>
</svg>
