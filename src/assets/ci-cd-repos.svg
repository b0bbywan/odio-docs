<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="odio repositories in three columns: the repos, the channel that ships them, and where they run. In-house and third-party packages ship as .deb through odio-apt-repo on apt.odio.love to the odio node; odios ships its installer and Pi images through a GitHub Release, which odio.love redirects to; odio.love, odio-docs and odio-pwa are served by Vercel, the PWA running entirely in the browser and talking to the node over the LAN; odio-ha and pyodio ship through the Home Assistant Marketplace and PyPI and run in Home Assistant, which also talks to the node over HTTP.">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5ab81e"/>
    </marker>
    <marker id="arrow-runtime" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a9190"/>
    </marker>
    <style>
      .col { fill: #8fd46a; font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-anchor: middle; }
      .repo { fill: #142010; stroke: #3a7020; stroke-width: 1.3; }
      .lib { fill: #0d130d; stroke: #486040; stroke-width: 1.2; }
      .channel { fill: #0d130d; stroke: #486040; stroke-width: 1.3; }
      .target { fill: #111616; stroke: #72797a; stroke-width: 1.3; }
      .name { fill: #e8e4dc; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
      .item { fill: #c8c4bc; font-size: 11.5px; text-anchor: middle; }
      .tag { fill: #a4adac; font-size: 10.5px; font-style: italic; text-anchor: middle; }
      .edge { stroke: #5ab81e; stroke-width: 1.4; fill: none; }
      .edge-runtime { stroke: #8a9190; stroke-width: 1.3; fill: none; stroke-dasharray: 4,3; }
      .edge-label { fill: #8fd46a; font-size: 10.5px; font-style: italic; text-anchor: middle; }
      .edge-label-runtime { fill: #a4adac; font-size: 10.5px; font-style: italic; text-anchor: middle; }
      .start { text-anchor: start; }
    </style>
  </defs>

  <!-- Column headers -->
  <text x="250" y="35" class="col">REPOS</text>
  <text x="740" y="35" class="col">SHIPPED THROUGH</text>
  <text x="1190" y="35" class="col">RUNS ON</text>

  <!-- ===== Column 1: repos ===== -->
  <rect x="30" y="55" width="440" height="120" rx="8" class="repo"/>
  <text x="250" y="78" class="name">In-house packages</text>
  <text x="250" y="100" class="item">go-odio-api · odioctl · go-mpd-discplayer</text>
  <text x="250" y="117" class="item">mpd2mpris · snapclientmpris · odio-framebuffer-ui</text>
  <text x="250" y="140" class="tag">Go libs compiled in: go-disc-cuer (in go-mpd-discplayer)</text>
  <text x="250" y="157" class="tag">go-odio-notify (planned)</text>

  <rect x="30" y="190" width="440" height="90" rx="8" class="repo"/>
  <text x="250" y="213" class="name">Third-party packaging</text>
  <text x="250" y="235" class="item">spotifyd · odio-mympd · odio-qbz</text>
  <text x="250" y="252" class="item">odio-upmpdcli · gstreamer1.0-openaptx</text>

  <rect x="30" y="288" width="440" height="24" rx="12" class="lib"/>
  <text x="250" y="304" class="tag">odio-ci · shared release workflows and binary checks</text>

  <rect x="30" y="330" width="440" height="45" rx="8" class="repo"/>
  <text x="250" y="349" class="name">odios</text>
  <text x="250" y="366" class="tag">Ansible installer · CalVer releases</text>

  <rect x="30" y="390" width="440" height="45" rx="8" class="repo"/>
  <text x="250" y="409" class="name">odio.love · odio-docs</text>
  <text x="250" y="426" class="tag">entry point and its redirects · this site and its daily stats</text>

  <rect x="30" y="450" width="440" height="45" rx="8" class="repo"/>
  <text x="250" y="469" class="name">odio-pwa</text>
  <text x="250" y="486" class="tag">Svelte web app, no backend</text>

  <rect x="30" y="515" width="440" height="45" rx="8" class="repo"/>
  <text x="250" y="534" class="name">odio-ha · pyodio</text>
  <text x="250" y="551" class="tag">Home Assistant integration on its async Python client</text>

  <!-- ===== Column 2: channels ===== -->
  <rect x="580" y="110" width="320" height="80" rx="8" class="channel"/>
  <text x="740" y="135" class="name">odio-apt-repo</text>
  <text x="740" y="155" class="item">apt.odio.love on GitHub Pages</text>
  <text x="740" y="172" class="item">reprepro · GPG-signed</text>

  <rect x="580" y="320" width="320" height="65" rx="8" class="channel"/>
  <text x="740" y="345" class="name">GitHub Release</text>
  <text x="740" y="365" class="item">odios installer · Pi images · Imager manifests</text>

  <rect x="580" y="415" width="320" height="85" rx="8" class="channel"/>
  <text x="740" y="437" class="name">Vercel</text>
  <text x="740" y="457" class="item">odio.love · docs.odio.love</text>
  <text x="740" y="474" class="item">pwa.odio.love (static files only)</text>

  <rect x="580" y="510" width="320" height="60" rx="8" class="channel"/>
  <text x="740" y="533" class="name">HA Marketplace · PyPI</text>
  <text x="740" y="552" class="item">odio-ha · pyodio · mpd2mpris · snapclientmpris</text>

  <!-- Repos → channels -->
  <path d="M 470 115 L 520 115 L 520 150" class="edge"/>
  <path d="M 470 235 L 520 235 L 520 150" class="edge"/>
  <path d="M 520 150 L 575 150" class="edge" marker-end="url(#arrow)"/>
  <text x="548" y="143" class="edge-label">.deb</text>

  <path d="M 470 352 L 575 352" class="edge" marker-end="url(#arrow)"/>
  <path d="M 470 412 L 525 412 L 525 440 L 575 440" class="edge" marker-end="url(#arrow)"/>
  <path d="M 470 472 L 575 472" class="edge" marker-end="url(#arrow)"/>
  <path d="M 470 537 L 575 537" class="edge" marker-end="url(#arrow)"/>

  <!-- odio.love → GitHub Release -->
  <path d="M 620 415 L 620 390" class="edge" marker-end="url(#arrow)"/>
  <text x="630" y="406" class="edge-label start">307 redirect</text>

  <!-- ===== Column 3: where it runs ===== -->
  <rect x="1010" y="110" width="360" height="275" rx="8" class="target"/>
  <text x="1190" y="230" class="name">odio node</text>
  <text x="1190" y="252" class="item">odio-api · players · MPRIS bridges</text>
  <text x="1190" y="269" class="item">installed and upgraded by odios</text>

  <rect x="1010" y="425" width="290" height="65" rx="8" class="target"/>
  <text x="1155" y="450" class="name">your browser</text>
  <text x="1155" y="468" class="tag">runs odio-pwa, no server involved</text>

  <rect x="1010" y="510" width="360" height="60" rx="8" class="target"/>
  <text x="1190" y="533" class="name">Home Assistant</text>
  <text x="1190" y="552" class="tag">odio-ha + pyodio</text>

  <!-- Channels → targets -->
  <path d="M 900 150 L 1005 150" class="edge" marker-end="url(#arrow)"/>
  <text x="952" y="143" class="edge-label">apt install</text>

  <path d="M 900 352 L 1005 352" class="edge" marker-end="url(#arrow)"/>
  <text x="952" y="332" class="edge-label">curl | bash</text>
  <text x="952" y="345" class="edge-label">or Pi Imager</text>

  <path d="M 900 457 L 1005 457" class="edge" marker-end="url(#arrow)"/>
  <text x="952" y="450" class="edge-label">static files</text>

  <path d="M 900 540 L 1005 540" class="edge" marker-end="url(#arrow)"/>
  <text x="952" y="533" class="edge-label">install</text>

  <!-- Runtime: browser and Home Assistant talk to the node -->
  <path d="M 1155 425 L 1155 390" class="edge-runtime" marker-end="url(#arrow-runtime)"/>
  <text x="1163" y="411" class="edge-label-runtime start">HTTP on the LAN</text>

  <path d="M 1335 510 L 1335 390" class="edge-runtime" marker-end="url(#arrow-runtime)"/>
  <text x="1343" y="455" class="edge-label-runtime start">HTTP</text>
</svg>
