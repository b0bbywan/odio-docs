<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="odio repo graph: clients and shared libraries at top (odio-ha, pyodio, odio-pwa, go-disc-cuer, go-odio-notify), a row of eight repos shipping .deb, odio-ci feeding the packaging repos, the odio-apt-repo distribution hub, then odios alongside odio.love and odio-docs, plus a hosting row with GitHub Pages and Vercel; deploy arrows go down to each platform, and the apt install fetch goes back up from GitHub Pages to odios.">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5ab81e"/>
    </marker>
    <marker id="arrow-runtime" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a9190"/>
    </marker>
    <style>
      .repo { fill: #142010; stroke: #3a7020; stroke-width: 1.3; }
      .repo-accent { fill: #1e3a18; stroke: #5ab81e; stroke-width: 1.6; }
      .repo-lib { fill: #0d130d; stroke: #486040; stroke-width: 1.3; }
      .repo-planned { fill: #0d130d; stroke: #486040; stroke-width: 1.3; stroke-dasharray: 4,3; }
      .repo-host { fill: #0d130d; stroke: #72797a; stroke-width: 1.2; stroke-dasharray: 4,3; }
      .name { fill: #e8e4dc; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
      .tag { fill: #c8c4bc; font-size: 10.5px; text-anchor: middle; font-style: italic; }
      .host-tag { fill: #a4adac; font-size: 10.5px; text-anchor: middle; }
      .edge-label { fill: #8fd46a; font-size: 10.5px; font-style: italic; text-anchor: middle; }
      .edge-label-runtime { fill: #a4adac; font-size: 10.5px; font-style: italic; text-anchor: middle; }
      .edge { stroke: #5ab81e; stroke-width: 1.4; fill: none; }
      .edge-planned { stroke: #5ab81e; stroke-width: 1.4; fill: none; stroke-dasharray: 4,3; }
      .edge-runtime { stroke: #8a9190; stroke-width: 1.3; fill: none; stroke-dasharray: 4,3; }
      .divider { stroke: #3a7020; stroke-width: 1; fill: none; stroke-dasharray: 2,4; opacity: 0.5; }
    </style>
  </defs>

  <!-- ROW 1: shared libraries (left) and clients (right) -->
  <rect x="25" y="30" width="150" height="52" rx="6" class="repo-lib"/>
  <text x="100" y="52" class="name">go-disc-cuer</text>
  <text x="100" y="69" class="tag">CUE / GnuDB lib</text>

  <rect x="195" y="30" width="175" height="52" rx="6" class="repo-planned"/>
  <text x="282" y="52" class="name">go-odio-notify</text>
  <text x="282" y="69" class="tag">audio notify lib (planned)</text>

  <rect x="470" y="30" width="170" height="52" rx="6" class="repo"/>
  <text x="555" y="52" class="name">odio-ha</text>
  <text x="555" y="69" class="tag">HA custom component</text>

  <rect x="665" y="30" width="170" height="52" rx="6" class="repo-lib"/>
  <text x="750" y="52" class="name">pyodio</text>
  <text x="750" y="69" class="tag">async Python client lib</text>

  <rect x="860" y="30" width="170" height="52" rx="6" class="repo"/>
  <text x="945" y="52" class="name">odio-pwa</text>
  <text x="945" y="69" class="tag">Svelte client app</text>

  <!-- Library edges into the daemons that compile them in -->
  <path d="M 100 82 L 100 140" class="edge" marker-end="url(#arrow)"/>
  <text x="92" y="112" class="edge-label" text-anchor="end">Go mod</text>

  <path d="M 282 82 L 282 140" class="edge-planned" marker-end="url(#arrow)"/>
  <text x="274" y="112" class="edge-label" text-anchor="end">Go mod</text>

  <path d="M 220 82 L 220 110 L 160 110 L 160 140" class="edge-planned" marker-end="url(#arrow)"/>
  <text x="190" y="104" class="edge-label">Go mod</text>

  <!-- Clients and the client library reach the API over HTTP -->
  <path d="M 555 82 L 555 120" class="edge-runtime"/>
  <path d="M 750 82 L 750 120" class="edge-runtime"/>
  <path d="M 945 82 L 945 120" class="edge-runtime"/>
  <path d="M 945 120 L 330 120 L 330 140" class="edge-runtime" marker-end="url(#arrow-runtime)"/>
  <text x="640" y="113" class="edge-label-runtime">HTTP at runtime</text>

  <!-- ROW 2: the eight repos that ship .deb -->
  <rect x="25" y="140" width="170" height="52" rx="6" class="repo-accent"/>
  <text x="110" y="162" class="name">go-mpd-discplayer</text>
  <text x="110" y="179" class="tag">CD / USB daemon (Go)</text>

  <rect x="213" y="140" width="145" height="52" rx="6" class="repo-accent"/>
  <text x="285" y="162" class="name">go-odio-api</text>
  <text x="285" y="179" class="tag">core REST API (Go)</text>

  <rect x="376" y="140" width="125" height="52" rx="6" class="repo-accent"/>
  <text x="438" y="162" class="name">odioctl</text>
  <text x="438" y="179" class="tag">node control (Go)</text>

  <rect x="519" y="140" width="168" height="52" rx="6" class="repo"/>
  <text x="603" y="162" class="name">b0bbywan/spotifyd</text>
  <text x="603" y="179" class="tag">Spotify daemon (fork)</text>

  <rect x="705" y="140" width="140" height="52" rx="6" class="repo"/>
  <text x="775" y="162" class="name">mpd2mpris</text>
  <text x="775" y="179" class="tag">MPRIS for MPD</text>

  <rect x="863" y="140" width="155" height="52" rx="6" class="repo"/>
  <text x="940" y="162" class="name">snapclientmpris</text>
  <text x="940" y="179" class="tag">MPRIS for Snapcast</text>

  <rect x="1036" y="140" width="140" height="52" rx="6" class="repo"/>
  <text x="1106" y="162" class="name">odio-mympd</text>
  <text x="1106" y="179" class="tag">myMPD · daily cron</text>

  <rect x="1194" y="140" width="125" height="52" rx="6" class="repo"/>
  <text x="1256" y="162" class="name">odio-qbz</text>
  <text x="1256" y="179" class="tag">qbzd · daily cron</text>

  <!-- .deb arrows down to the apt repo -->
  <path d="M 110 192 L 110 280" class="edge" marker-end="url(#arrow)"/>
  <text x="118" y="215" class="edge-label" text-anchor="start">.deb</text>

  <path d="M 285 192 L 285 280" class="edge" marker-end="url(#arrow)"/>
  <text x="293" y="215" class="edge-label" text-anchor="start">.deb</text>

  <path d="M 438 192 L 438 280" class="edge" marker-end="url(#arrow)"/>
  <text x="446" y="215" class="edge-label" text-anchor="start">.deb</text>

  <path d="M 603 192 L 603 280" class="edge" marker-end="url(#arrow)"/>
  <text x="611" y="215" class="edge-label" text-anchor="start">.deb</text>

  <path d="M 775 192 L 775 280" class="edge" marker-end="url(#arrow)"/>
  <text x="783" y="215" class="edge-label" text-anchor="start">.deb</text>

  <path d="M 940 192 L 940 280" class="edge" marker-end="url(#arrow)"/>
  <text x="948" y="215" class="edge-label" text-anchor="start">.deb</text>

  <path d="M 1106 192 L 1106 280" class="edge" marker-end="url(#arrow)"/>
  <text x="1114" y="215" class="edge-label" text-anchor="start">.deb</text>

  <path d="M 1256 192 L 1256 280" class="edge" marker-end="url(#arrow)"/>
  <text x="1264" y="215" class="edge-label" text-anchor="start">.deb</text>

  <!-- odio-ci: reusable workflows and actions, also used by odioctl -->
  <rect x="950" y="222" width="145" height="46" rx="6" class="repo-lib"/>
  <text x="1022" y="242" class="name">odio-ci</text>
  <text x="1022" y="258" class="tag">reusable workflows</text>

  <path d="M 1060 222 L 1060 192" class="edge-planned" marker-end="url(#arrow)"/>
  <path d="M 1095 240 L 1240 240 L 1240 192" class="edge-planned" marker-end="url(#arrow)"/>

  <!-- ROW 3: odio-apt-repo hub -->
  <rect x="90" y="280" width="1240" height="60" rx="8" class="repo-accent"/>
  <text x="710" y="303" class="name">odio-apt-repo</text>
  <text x="710" y="322" class="tag">reprepro · GPG-signed · cron Mon + Thu · apt.odio.love</text>

  <!-- ROW 4: odios + odio.love + odio-docs -->
  <rect x="330" y="380" width="310" height="70" rx="8" class="repo-accent"/>
  <text x="485" y="405" class="name">odios</text>
  <text x="485" y="423" class="tag">Ansible installer / orchestrator</text>
  <text x="485" y="438" class="tag">runs on your node</text>

  <rect x="700" y="380" width="240" height="70" rx="8" class="repo"/>
  <text x="820" y="405" class="name">odio.love</text>
  <text x="820" y="423" class="tag">307 → latest odios release</text>
  <text x="820" y="438" class="tag">/install · /manifest.json</text>

  <rect x="980" y="380" width="180" height="70" rx="8" class="repo"/>
  <text x="1070" y="405" class="name">odio-docs</text>
  <text x="1070" y="423" class="tag">Astro / Starlight</text>
  <text x="1070" y="438" class="tag">docs.odio.love · stats.odio.love</text>

  <!-- odio.love → odios: 307 redirect to the GitHub Release -->
  <path d="M 700 415 L 652 415" class="edge" marker-end="url(#arrow)"/>
  <text x="670" y="372" class="edge-label">307 → GH Release</text>

  <!-- apt-repo → GH Pages (deploy) and GH Pages → odios (apt install fetches the .deb) -->
  <path d="M 250 340 L 250 500" class="edge" marker-end="url(#arrow)"/>
  <path d="M 390 500 L 390 450" class="edge" marker-end="url(#arrow)"/>
  <text x="400" y="478" class="edge-label" text-anchor="start">apt install odio-*</text>

  <!-- Vercel deploy arrows -->
  <path d="M 820 450 L 820 500" class="edge" marker-end="url(#arrow)"/>
  <path d="M 1070 450 L 1070 500" class="edge" marker-end="url(#arrow)"/>
  <path d="M 1030 56 L 1375 56 L 1375 530 L 1162 530" class="edge" marker-end="url(#arrow)"/>

  <!-- Divider between flow and hosting -->
  <line x1="40" y1="485" x2="1360" y2="485" class="divider"/>

  <!-- ROW 5: Hosting -->
  <rect x="60" y="500" width="360" height="60" rx="8" class="repo-host"/>
  <text x="240" y="522" class="name">GitHub Pages</text>
  <text x="240" y="542" class="host-tag">hosts apt.odio.love · stats.odio.love</text>

  <rect x="470" y="500" width="690" height="60" rx="8" class="repo-host"/>
  <text x="815" y="522" class="name">Vercel</text>
  <text x="815" y="542" class="host-tag">hosts odio.love · docs.odio.love (odio-docs) · pwa.odio.love (odio-pwa)</text>
</svg>
